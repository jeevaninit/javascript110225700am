<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let arrayofobject = [
            { name: "John", age: 30, city: "New York",courses:['java','python','javascript'] },
            { name: "Jane", age: 25, city: "Los Angeles",courses:['c++','python','java'] },
            { name: "Smith", age: 35, city: "Chicago",courses:['javascript','python','c++'] }
        ];
        function myFunction(name, callback) {
            console.log("Hello " + name);
            callback();
        }
        myFunction("John", () => {
            console.log("This is a callback function.");
            console.log("Array of objects:");
            arrayofobject.forEach((obj, index) => {
                console.log(`Object ${index + 1}:`);
                for (let key in obj) {
                    console.log(key + ": " + obj[key]);
                }
                if(arrayofobject[1].courses[1]=='javascript'){
                    console.log("this is ight information.");
                }
                else{
                    console.log("The second course of the second object is not Python.");
                }
            });
        });
    </script>
</body>
</html>
