<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Working with Variable Scope</h1>
    <hr>
    <script>

/* Global Scope */
        let globalVar='I am from Global Variable..'; //global variable

        function showGlobal(){
            document.write(globalVar+'<br>');
        }

        showGlobal();
        document.write(globalVar);

/*    ******************  */

//The important part: var ignores blocks
//Consider this:

if (true) {
  var name = "John";
}

console.log(name); // John

/* 

Even though name was declared inside the if block, it is accessible outside the block.

That's because var does not have block scope.

Compare it with let:

*/

if (true) {
  let name = "John";
}

console.log(name); // ReferenceError




{
  let city = "Hyderabad";

  console.log(city); // Hyderabad
}

console.log(city); // ReferenceError


/* The most important example: var vs let
Look at this loop: */

for (var i = 0; i < 3; i++) {
  console.log(i);
}

console.log(i);

/* 0
1
2
3

i is still accessible after the loop because var is not block-scoped.
 */

 for (let i = 0; i < 3; i++) {
  console.log(i);
}

console.log(i);


/* The final console.log(i) produces:

ReferenceError

because let i exists only inside the for block.

This is one reason let is generally safer than var.

 */

/* **************************** */

/* functional Scope  and Block Scope*/

        function myfunction(){
            let localvar='Hello am from Local Variable...';
            console.log(localvar);
            console.log(globalVar);

                    if(true){
                                let blockvar='Welcome to Block Level Scope...';
                                const constvar='Block scope with const';

                                console.log(blockvar);
                                console.log(constvar);

                            }

                            //console.log(blockvar);
                            //console.log(constvar);
         }

        myfunction();
        //console.log(localvar);



/* Lexical Scope */

function outerfun(){
    let outerfunvar='Hello am from Outer function variable';


        function innerfun(){
            console.log(outerfunvar);
        }

    //console.log(outerfunvar);
    innerfun();

}


outerfun();

/* Scope Chain */
function outer(){
    let outervar='I am Outer';

    function inner(){
        let innervar='I am Inner';
        console.log(innervar);
        console.log(outervar);
        console.log(globalVar);

    }
    inner();
}
outer();


    </script>
</body>
</html>
